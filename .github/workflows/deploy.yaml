name: Deploy Laravel to Server via RSYNC

on:
  push:
    branches: ["development"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, mysql, bcmath
          tools: composer

      - name: Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1
          COMPOSER_PROCESS_TIMEOUT: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install NPM dependencies
        run: npm install

      - name: Build Assets
        run: npm run build

      - name: Setup SSH Key and Known Hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Validating SSH key..."
          ssh-keygen -l -f ~/.ssh/deploy_key || {
            echo "❌ Invalid SSH Key in DEPLOY_KEY"
            exit 1
          }

          touch ~/.ssh/known_hosts
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH Connection OK'"

      - name: Pre-deploy Permissions Fix
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          cd ${{ secrets.APP_PATH }}
          php artisan down || true

          sudo chown -R $USER:$USER .
          sudo chmod -R 755 .

          sudo chmod -R 775 storage bootstrap/cache

          sudo rm -rf storage/framework/sessions/*
          sudo rm -rf storage/framework/views/*
          sudo rm -rf storage/logs/*.log
          EOF

      - name: Deploy via RSYNC
        run: |
          rsync -azP \
            --delete \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="tests" \
            --exclude=".env" \
            --exclude="storage/*.key" \
            --exclude="storage/app/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/cache/*" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}

      - name: Post-Deploy Commands
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.APP_PATH }}

          composer install --no-dev --optimize-autoloader --no-interaction

          chmod -R 775 storage bootstrap/cache

          php artisan down || true
          php artisan migrate --force

          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          php artisan queue:restart || true
          php artisan up
          EOF

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
