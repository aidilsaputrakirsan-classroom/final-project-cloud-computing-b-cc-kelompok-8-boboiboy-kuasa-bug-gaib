name: Deploy Laravel to Server via RSYNC

on:
  push:
    branches: ["development"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"

    - name: Install NPM dependencies
      run: npm install

    - name: Build Assets
      run: npm run build

    - name: Setup SSH Key and Known Hosts
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        # Validate SSH key
        ssh-keygen -l -f ~/.ssh/deploy_key || {
          echo "❌ SSH key validation failed!"
          exit 1
        }

        # Add server to known_hosts
        touch ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
        ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Test SSH Connection
      run: |
        ssh -i ~/.ssh/deploy_key \
          -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "echo '✅ SSH Connection successful!'"

    - name: Deploy via RSYNC (exclude vendor/)
      run: |
        rsync -rltgoDvzP \
          --exclude=".git" \
          --exclude=".github" \
          --exclude="node_modules" \
          --exclude="tests" \
          --exclude=".env" \
          --exclude="storage/*.key" \
          --exclude="vendor" \
          --delete \
          --delete-excluded \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
          ./ \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.APP_PATH }}

    - name: Run Post-Deployment Commands on Server
      run: |
        ssh -i ~/.ssh/deploy_key \
          -p ${{ secrets.SSH_PORT }} \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
        set -e

        cd ${{ secrets.APP_PATH }}

        echo "📦 Installing Composer dependencies..."
        composer install --no-dev --optimize-autoloader --no-interaction

        echo "🔧 Setting file permissions (no chown needed)..."
        find . -type d -exec chmod 775 {} \;
        find . -type f -exec chmod 664 {} \;
        chmod -R 775 storage bootstrap/cache

        echo "⏸️  Putting app in maintenance mode..."
        php artisan down || true

        echo "🗄️  Running database migrations..."
        php artisan migrate --force

        echo "🧹 Clearing and optimizing..."
        php artisan optimize:clear
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

        echo "✅ Bringing app back online..."
        php artisan up

        echo "🎉 Deployment completed!"
        EOF

    - name: Cleanup
      if: always()
      run: |
        rm -f ~/.ssh/deploy_key
        echo "🧹 SSH key removed"
